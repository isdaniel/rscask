[workspace]
resolver = "2"
members = [
    "src/rscask",
    "src/rscaskd",
    "src/rscask-cli",
]

[workspace.dependencies]
clap = { version = "4.5.57", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
thiserror = "2.0.18"
